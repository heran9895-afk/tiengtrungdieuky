/* ===== TOKEN CHUNG — 奇妙汉语 ===== */
:root{
  --brand:#0b5a2a; --brand-soft:#eaf8ef; --gold:#e2ad28; --red:#b31916;
  --ink:#3a3a3a; --muted:#7c7264; --line:#d8c28a; --line-soft:rgba(11,90,42,.18);
  --surface:#fff; --surface-2:#faf7f0;
  --r-card:18px; --r-box:12px; --r-pill:999px;
  --shadow:0 10px 28px rgba(0,0,0,.08); --shadow-hover:0 14px 36px rgba(11,90,42,.13);
  --font-ui:'PyTone','Quicksand',system-ui,Arial,sans-serif; --font-cn:'Noto Serif SC',serif;
  --fs-word:38px; --fs-cn:17px; --fs-py:16px; --fs-text:15px; --fs-label:11px;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--ink);font-family:var(--font-ui);font-weight:600}
.hanzi{font-family:var(--font-cn);font-weight:700}
button{font-family:inherit}
.btn{border:2px solid var(--brand);background:#fff;color:var(--brand);border-radius:var(--r-pill);
     padding:10px 18px;font-weight:800;font-size:15px;cursor:pointer;transition:.15s}
.btn:hover,.btn.solid{background:var(--brand);color:#fff}
.btn:focus-visible,.tile:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-card);box-shadow:var(--shadow)}

body::after{content:"";position:fixed;inset:0;background-image:var(--logo);background-repeat:no-repeat;
  background-position:center 46%;background-size:min(62vw,420px) auto;opacity:.07;
  mix-blend-mode:multiply;pointer-events:none;z-index:9999}

/* ===== HEADER 奇妙汉语 ===== */
.hdr{background:var(--brand);color:#fff;border-radius:var(--r-card);padding:18px 16px 16px;margin-bottom:14px;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hdr::after{content:"";position:absolute;inset:auto -30px -40px auto;width:120px;height:120px;border-radius:50%;background:rgba(226,173,40,.18)}
.hdr .slogan{font-family:var(--font-cn);font-weight:900;font-size:24px;line-height:1.35;letter-spacing:.04em;margin:0}
.hdr .teacher{margin:8px 0 12px;font-size:var(--fs-text);opacity:.95}
.hdr .teacher b{font-weight:800}
.hdr .links{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;position:relative;z-index:1}
.hdr .links a{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--brand);border-radius:var(--r-pill);padding:8px 14px;font-weight:800;font-size:14px;text-decoration:none;transition:.15s}
.hdr .links a:hover{background:var(--gold);color:#3a2a12}
.hdr .links a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hdr .links svg{width:16px;height:16px}
@media (max-width:380px){ .hdr .slogan{font-size:20px} }

/* ===== KHUNG GAME ===== */
.wrap{max-width:720px;margin:0 auto;padding:12px 12px 24px}
.box{padding:16px;position:relative}
.hud{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.hud b{color:var(--ink)}
.hud .sc{margin-left:auto;font-size:16px;color:var(--brand)}
.mute{border:none;background:none;font-size:18px;cursor:pointer;padding:4px;color:var(--muted)}
.timer{height:8px;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--line-soft);overflow:hidden;margin:10px 0 4px}
.timer i{display:block;height:100%;width:100%;background:var(--brand);transform-origin:left;transition:background .3s}
.timer.low i{background:var(--red)}
.secs{font-size:12px;color:var(--muted);text-align:right;min-height:16px}

/* Đề bài: ô chữ cần ghép */
.ask{display:flex;gap:14px;align-items:center;margin:6px 0 14px}
.slot{flex:none;width:96px;height:96px;border:3px dashed var(--gold);border-radius:var(--r-box);background:#fff8e6;
      display:grid;place-items:center;font-size:60px;color:var(--gold);font-family:var(--font-cn);font-weight:900;position:relative}
.slot.ok{border-style:solid;border-color:var(--brand);background:var(--brand-soft);color:var(--red)}
.slot.bad{border-style:solid;border-color:var(--red);background:#fdecec;color:var(--red)}
.slot .pop{position:absolute;top:-14px;right:-10px;background:var(--brand);color:#fff;font-family:var(--font-ui);font-size:14px;
      font-weight:800;padding:2px 9px;border-radius:var(--r-pill);animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.meta .w{font-family:var(--font-cn);font-weight:700;font-size:26px;color:var(--ink);line-height:1.2}
.meta .w .hole{display:inline-block;width:.9em;height:.9em;vertical-align:-.08em;border:2px dashed var(--gold);border-radius:5px;background:#fff8e6}
.meta .p{font-size:var(--fs-py);color:var(--brand);font-weight:800}
.meta .v{font-size:var(--fs-text);margin-top:2px}
.meta .read{font-size:13px;color:var(--muted);margin-top:4px}
.meta .read b{color:var(--brand)}
.need{font-size:14px;margin:0 0 8px}
.need b{color:var(--red)}

/* 4 ô bộ phận */
.tiles{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:8px}
.tile{border:2px solid var(--line);background:#fff;border-radius:var(--r-box);padding:10px 4px 8px;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s,border-color .12s,background .12s;min-height:92px}
.tile .hanzi{font-size:40px;line-height:1.1;color:var(--ink)}
.tile .py{font-size:13px;color:var(--muted);font-weight:700}
.tile:hover{transform:translateY(-2px)}
.tile.sel{border-color:var(--gold);background:#fff8e6;box-shadow:0 0 0 3px rgba(226,173,40,.35)}
.tile.right{border-color:var(--brand);background:var(--brand-soft)}
.tile.wrong{border-color:var(--red);background:#fdecec}
.tile.missed{border-color:var(--brand);border-style:dashed}
.tile:disabled{cursor:default;transform:none;color:inherit}

/* Lời giải sau mỗi câu */
.note{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:10px;font-size:14px}
.note strong{display:block;font-size:15px;margin-bottom:6px}
.note.ok strong{color:var(--brand)} .note.bad strong{color:var(--red)}
.row{display:grid;grid-template-columns:44px 58px 1fr;gap:6px;align-items:center;padding:3px 0}
.row .hanzi{font-size:24px;color:var(--red);text-align:center}
.row .p{color:var(--brand);font-weight:800}
.row.whole{border-top:1px dashed var(--line);margin-top:4px;padding-top:6px}
.row.whole .hanzi{font-size:30px}
.struct{color:var(--muted);font-size:13px;margin-top:4px}
.next{display:flex;justify-content:flex-end;margin-top:12px}

/* Màn bắt đầu và kết quả */
.panel{text-align:center}
.panel h1{margin:2px 0 4px;font-size:24px;color:var(--brand)}
.rules{text-align:left;margin:12px 0;padding:0 0 0 18px;font-size:14px;line-height:1.55}
.rules li{margin:3px 0}
.who{display:flex;gap:8px;margin:12px 0 4px}
.who input{flex:1;min-width:0;border:2px solid var(--line-soft);border-radius:var(--r-box);padding:10px 12px;font:inherit;font-size:15px;color:var(--ink);background:#fff}
.who input:focus{outline:none;border-color:var(--brand)}
.who input.miss{border-color:var(--red)}
.who #lop{flex:0 0 96px}
.warn{color:var(--red);font-size:13px;min-height:18px;margin:2px 0 8px}
.big{font-size:52px;font-weight:800;color:var(--brand);line-height:1;margin-top:6px}
.stats{display:flex;justify-content:center;gap:18px;font-size:13px;color:var(--muted);margin:10px 0}
.stats b{display:block;font-size:20px;color:var(--ink)}
.send{font-size:13px;margin:4px 0 10px;color:var(--muted);min-height:18px}
.send.ok{color:var(--brand)} .send.bad{color:var(--red)}
.send button{margin-left:6px;padding:4px 12px;font-size:13px}
.review{list-style:none;padding:0;margin:8px 0 14px;display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:left}
.review li{display:flex;align-items:center;gap:8px;border:1px solid var(--line-soft);border-radius:10px;padding:6px 8px;font-size:13px}
.review .hanzi{font-size:22px;color:var(--red)}
.review .got{color:var(--muted)}
.review .mark{margin-left:auto;font-weight:800}
.review .y{color:var(--brand)} .review .x{color:var(--red)}
@media (max-width:380px){.tile .hanzi{font-size:34px}.slot{width:84px;height:84px;font-size:52px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <p class="slogan" lang="zh">奇妙汉语，学语言悟人生</p>
    <p class="teacher">Giáo viên: <b>Nguyễn Hà Nhiên</b></p>
    <div class="links">
      <a href="https://www.facebook.com/profile.php?id=61591127255931" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-7.5h2.5l.4-3h-2.9V8.6c0-.9.3-1.4 1.5-1.4h1.5V4.5c-.3 0-1.2-.1-2.2-.1-2.2 0-3.7 1.3-3.7 3.8v2.3H8.1v3h2.5V21h2.9z"/></svg>Facebook</a>
      <a href="https://zalo.me/0973754714" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.2 7.5L3 21l2-5.3A8.5 8.5 0 1 1 21 11.5z"/></svg>Zalo 0973 754 714</a>
    </div>
  </header>
  <div class="card box" id="app"></div>
</div>

<script src="du-lieu/danh-sach-bai.js"></script>
<script src="du-lieu/nap-du-lieu.js"></script>
<script>QMHY.napTatCa();</script>
<script>
/* ===== DỮ LIỆU: lấy từ thư mục du-lieu theo bài trong link (dinh-luyen-chu.html?bai=bai-3, ?bai=tong-hop) =====
   Link chưa chọn bài thì hiện màn chọn bài và dừng ở đây. */
const D = QMHY.gop('ghep', '#app');
if (!D) throw new Error('Chưa chọn bài');
const PART = D.PART, CHARS = D.CHARS;
document.title = 'Đỉnh luyện chữ · ' + D.ten;

/* ===== GỬI ĐIỂM LÊN BẢNG XẾP HẠNG (Apps Script 奇妙汉语, lệnh submit — cùng địa chỉ với game chém chữ) ===== */
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxvHN55cw3hIJFVU7cflv07WtsnSWgF8tm-kc3esYxST-uVcyrCRc4_yP8doZ_jUQG3/exec';
const LESSON = D.ma;                                  // mã điểm của bài đang chơi, bảng xếp hạng lọc theo mã này
const WHO_KEY = 'qmhy:hoc-sinh';                     // dùng chung với các game khác: nhớ tên và lớp
const BEST_KEY = 'qmhy:dinh-luyen-chu-' + D.id + ':best', MUTE_KEY = 'qmhy:game:mute';

/* ===== CÀI ĐẶT ===== */
const Q_TIME = 15;                                    // giây cho mỗi câu
const BASE = 50, PER_SEC = 10;                        // đúng: 50 điểm + 10 điểm cho mỗi giây còn lại



const $ = id => document.getElementById(id);
const app = $('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.random()*(i+1)|0; [a[i],a[j]] = [a[j],a[i]]; } return a; };
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
const partPy = p => (PART[p] || ['',''])[0];

/* ===== ÂM THANH: máy tự tạo, không cần file mp3 ===== */
let actx = null, muted = store.get(MUTE_KEY) === '1';
function ac(){ if (!actx){ try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
function tone(f, d, type='sine', v=.18, at=0){
  if (muted) return; const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at;
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + d);
}
const sfx = {
  tap(){ tone(660,.06,'triangle',.12); },
  ok(n){ const b = 523 * Math.pow(1.06, Math.min(n,8)); tone(b,.12,'triangle'); tone(b*1.5,.18,'triangle',.16,.08); },
  bad(){ tone(180,.28,'sawtooth',.12); },
  tick(){ tone(1000,.04,'square',.06); },
  end(win){ [523,659,784,win?1047:659].forEach((f,i) => tone(f,.22,'triangle',.16,i*.13)); }
};

/* ===== TRẠNG THÁI ===== */
let qs = [], idx = 0, score = 0, streak = 0, bestStreak = 0, answers = [], log = [];
let sel = [], locked = false, tiles = [], timer = null, left = Q_TIME, qStart = 0, playStart = 0;
let playerName = '', playerClass = '', attemptId = '';

/* ===== MÀN BẮT ĐẦU ===== */
function intro(){
  stop();
  const best = +store.get(BEST_KEY) || 0;
  app.innerHTML = `<div class="panel">
    <h1>Đỉnh luyện chữ · ${D.ten}</h1>
    <ol class="rules">
      <li>Mỗi câu cho phiên âm và nghĩa của một chữ. Em chọn các bộ phận ghép thành chữ đó.</li>
      <li>Mỗi câu ghi rõ cần chọn mấy bộ phận. Chọn đủ là máy chấm ngay.</li>
      <li>Mỗi câu có ${Q_TIME} giây. Đúng được ${BASE} điểm, cộng thêm ${PER_SEC} điểm cho mỗi giây còn lại.</li>
    </ol>
    <div class="who"><input id="ten" placeholder="Họ và tên" autocomplete="name"><input id="lop" placeholder="Lớp"></div>
    <p class="warn" id="warn"></p>
    ${best ? `<p class="send">Kỷ lục trên máy này: ${best} điểm</p>` : ''}
    <button class="btn solid" id="go">Bắt đầu</button></div>`;
  try { const w = JSON.parse(store.get(WHO_KEY) || 'null'); if (w){ $('ten').value = w.ten || ''; $('lop').value = w.lop || ''; } } catch(e){}
  ['ten','lop'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') begin(); }));
  $('go').onclick = begin;
}

function begin(){
  const t = $('ten'), l = $('lop');
  playerName = t.value.trim().replace(/\s+/g,' '); playerClass = l.value.trim();
  t.classList.toggle('miss', !playerName); l.classList.toggle('miss', !playerClass);
  if (!playerName || !playerClass){ $('warn').textContent = 'Em nhập họ tên và lớp để lên bảng xếp hạng nhé.'; return; }
  store.set(WHO_KEY, JSON.stringify({ten:playerName, lop:playerClass}));
  ac();
  restart();
}

function restart(){
  qs = shuffle(CHARS); idx = 0; score = 0; streak = 0; bestStreak = 0; answers = []; log = [];
  attemptId = Date.now() + '_' + Math.random().toString(36).slice(2,8);
  playStart = Date.now();
  ask();
}

/* ===== MỘT CÂU ===== */
function ask(){
  const q = qs[idx];
  const fakes = shuffle(q.fake).slice(0, Math.max(4, q.parts.length + 1) - q.parts.length);
  tiles = shuffle([...q.parts, ...fakes]);
  sel = []; locked = false; left = Q_TIME;
  const word = q.word
    ? `<div class="w">${[...q.word].map(x => x === '□' ? '<span class="hole"></span>' : x).join('')}</div>
       <div class="p">${q.wpy}</div><div class="v">${esc(q.vi)}</div>
       <div class="read">Chữ cần ghép đọc là <b>${q.py}</b></div>`
    : `<div class="p" style="font-size:22px">${q.py}</div><div class="v">${esc(q.vi)}</div>`;
  app.innerHTML = `
    <div class="hud"><span>Câu <b>${idx+1}</b>/${qs.length}</span><span>Chuỗi đúng: <b id="stk">${streak}</b></span>
      <span class="sc" id="sc">${score} điểm</span>
      <button class="mute" id="mute" aria-label="Bật hoặc tắt âm thanh">${muted ? '🔇' : '🔊'}</button></div>
    <div class="timer" id="tm"><i id="bar"></i></div><div class="secs" id="secs">${Q_TIME} giây</div>
    <div class="ask"><div class="slot" id="slot">?</div><div class="meta">${word}</div></div>
    <p class="need">Chọn <b>${q.parts.length}</b> bộ phận ghép thành chữ này.</p>
    <div class="tiles" id="tiles" style="--n:${tiles.length}">${tiles.map((p,i) => `<button class="tile" data-i="${i}" aria-pressed="false">
      <span class="hanzi">${p}</span><span class="py">${partPy(p)}</span></button>`).join('')}</div>
    <div id="after"></div>`;
  $('tiles').querySelectorAll('.tile').forEach(b => b.onclick = () => pick(+b.dataset.i));
  $('mute').onclick = () => { muted = !muted; store.set(MUTE_KEY, muted ? '1' : '0'); $('mute').textContent = muted ? '🔇' : '🔊'; };
  qStart = performance.now();
  stop(); timer = setInterval(tick, 100);
  requestAnimationFrame(drawBar);
}

function tick(){
  const el = (performance.now() - qStart) / 1000, before = Math.ceil(left);
  left = Math.max(0, Q_TIME - el);
  const now = Math.ceil(left);
  $('secs').textContent = now + ' giây';
  $('tm').classList.toggle('low', left <= 5);
  if (now < before && now <= 5 && now > 0) sfx.tick();
  if (left <= 0) check(true);
}
function drawBar(){
  if (locked || !$('bar')) return;
  $('bar').style.transform = `scaleX(${Math.max(0, 1 - (performance.now() - qStart) / 1000 / Q_TIME)})`;
  requestAnimationFrame(drawBar);
}
function stop(){ if (timer){ clearInterval(timer); timer = null; } }

function pick(i){
  if (locked) return;
  const k = sel.indexOf(i);
  if (k >= 0) sel.splice(k,1); else sel.push(i);
  sfx.tap();
  $('tiles').querySelectorAll('.tile').forEach((b,j) => { const on = sel.includes(j); b.classList.toggle('sel', on); b.setAttribute('aria-pressed', on); });
  if (sel.length === qs[idx].parts.length) check(false);
}

/* Chọn đủ bộ phận theo thứ tự nào cũng tính đúng; lời giải hiện cấu trúc chữ để học vị trí */
function check(timeout){
  if (locked) return;
  locked = true; stop();
  const q = qs[idx];
  const got = sel.map(i => tiles[i]);
  const ok = !timeout && got.length === q.parts.length && got.every(p => q.parts.includes(p));
  const secsLeft = Math.ceil(left);
  const gain = ok ? BASE + PER_SEC * secsLeft : 0;
  if (ok){ score += gain; streak++; bestStreak = Math.max(bestStreak, streak); sfx.ok(streak); }
  else { streak = 0; sfx.bad(); }
  answers.push({c:q.c, ok, got: timeout && !got.length ? 'hết giờ' : got.join(' + ')});
  log.push({index:log.length+1, type:'ghep', typeName:'Ghép bộ phận thành chữ',
    question: `${q.py} – ${q.vi}`, userAnswer: timeout ? (got.join('+') || 'hết giờ') : got.join('+'),
    correctAnswer: q.c + ' = ' + q.parts.join('+'), correct: ok, secondsLeft: secsLeft});

  document.querySelectorAll('.meta .hole').forEach(h => h.outerHTML = `<span style="color:var(--red)">${q.c}</span>`);
  const slot = $('slot');
  slot.textContent = q.c; slot.classList.add(ok ? 'ok' : 'bad');
  if (ok) slot.insertAdjacentHTML('beforeend', `<span class="pop">+${gain}</span>`);
  $('tiles').querySelectorAll('.tile').forEach((b,j) => {
    b.disabled = true;
    const isPart = q.parts.includes(tiles[j]), chosen = sel.includes(j);
    b.classList.remove('sel');
    if (isPart && chosen) b.classList.add('right');
    else if (chosen) b.classList.add('wrong');
    else if (isPart) b.classList.add('missed');
  });
  $('sc').textContent = score + ' điểm'; $('stk').textContent = streak;
  $('secs').textContent = timeout ? 'Hết giờ' : secsLeft + ' giây';

  const mean = q.word ? `${q.vi} (trong từ ${q.word.replace(/□/g, q.c)})` : q.vi;
  const head = ok ? `Đúng rồi. +${gain} điểm`
             : timeout ? 'Hết giờ.'
             : `Chưa đúng. Em chọn ${got.join(' + ')}.`;
  $('after').innerHTML = `<div class="note ${ok ? 'ok' : 'bad'}" aria-live="polite"><strong>${head}</strong>
    ${q.parts.map(p => `<div class="row"><span class="hanzi">${p}</span><span class="p">${partPy(p)}</span><span>${esc(PART[p][1])}</span></div>`).join('')}
    <div class="row whole"><span class="hanzi">${q.c}</span><span class="p">${q.py}</span><span>${esc(mean)}</span></div>
    <div class="struct">Cấu trúc: ${q.st}</div></div>
    <div class="next"><button class="btn solid" id="nx">${idx === qs.length-1 ? 'Xem kết quả' : 'Câu tiếp theo'}</button></div>`;
  $('nx').onclick = () => { idx++; idx < qs.length ? ask() : result(); };
  $('nx').focus({preventScroll:true});
}

/* ===== KẾT QUẢ ===== */
function result(){
  stop();
  const n = answers.filter(a => a.ok).length, t = answers.length;
  const best = +store.get(BEST_KEY) || 0, isNew = score > best;
  if (isNew) store.set(BEST_KEY, score);
  sfx.end(isNew);
  const msg = n === t ? 'Hoàn hảo, em ghép đúng tất cả.' : n >= t*0.8 ? 'Rất tốt. Xem lại vài chữ sai bên dưới nhé.' : 'Xem lại các chữ sai rồi chơi lại nhé.';
  app.innerHTML = `<div class="panel">
    <div class="big">${score}</div><p>điểm · ${esc(playerName)}, lớp ${esc(playerClass)}</p>
    <p class="send" id="sendSt"></p>
    <div class="stats"><span><b>${n}/${t}</b>câu đúng</span><span><b>${bestStreak}</b>chuỗi đúng dài nhất</span></div>
    <p>${msg}${isNew ? ' Kỷ lục mới trên máy này!' : ''}</p>
    <ul class="review">${answers.map(a => `<li><span class="hanzi">${a.c}</span>
      ${a.ok ? '' : `<span class="got hanzi" style="font-size:13px">${esc(a.got)}</span>`}
      <span class="mark ${a.ok ? 'y' : 'x'}">${a.ok ? 'Đúng' : 'Sai'}</span></li>`).join('')}</ul>
    <button class="btn solid" id="again">Chơi lại</button></div>`;
  $('again').onclick = restart;
  submit();
}

function submit(){
  const st = $('sendSt');
  st.className = 'send'; st.textContent = 'Đang gửi điểm lên bảng xếp hạng…';
  const body = {
    action:'submit', lesson:LESSON, phanLoai:'game', bai:D.id,
    hoTenHocSinh:playerName, lop:playerClass, attemptId,
    score, total:qs.length, bestStreak,
    durationSeconds: Math.round((Date.now() - playStart) / 1000),
    mode:'dinh-luyen-chu', poolTotal:CHARS.length, timeout:false,
    chiTiet: log
  };
  fetch(SHEET_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)})
    .then(r => r.json())
    .then(d => {
      if (!d.ok) throw new Error(d.error || 'lỗi');
      st.className = 'send ok'; st.textContent = 'Đã lên bảng xếp hạng.';
    })
    .catch(() => {
      if (!$('sendSt')) return;
      st.className = 'send bad';
      st.innerHTML = 'Chưa gửi được điểm. <button class="btn" id="resend">Gửi lại</button>';
      $('resend').onclick = submit;
    });
}

intro();
</script>
